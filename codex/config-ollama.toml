# Codex configuration.
#
# Global defaults plus the Ollama gateway that replaces OpenAI's API. Codex reads
# this once at startup; restart Codex after changing it.
#
# TOML attaches every key to the table header above it, so all scalars are
# grouped here at the top, after which come the tables.

check_for_update_on_startup = false

# Pause for approval before commands that leave the sandbox. `on-request` is the
# interactive default; `never` is for non-interactive runs.
approval_policy = "on-request"

# Commands may write inside the workspace. Anything outside prompts.
sandbox_mode = "workspace-write"

# Route every session to the local Ollama gateway, like claude/settings-ollama.json
# does for Claude Code. Subagents inherit this, so orchestrator work runs on the
# same model.
model = "deepseek-v4.1-flash:cloud"
model_provider = "ollama-gw"

# The gateway reports a 1048576-token window for this model via ollama's
# /api/show, so a 1000000 window with compaction at 900000 fits.
model_context_window = 1000000
model_auto_compact_token_limit = 900000

# Carried over from the oh-my-codex config. See the OMX block note below.
notify = ["node", "/usr/lib/node_modules/oh-my-codex/dist/scripts/notify-hook.js"]
model_reasoning_effort = "high"
developer_instructions = "You have oh-my-codex installed. AGENTS.md is your orchestration brain and the main orchestration surface. Use skill/keyword routing like $name plus spawned role-specialized subagents for specialized work. Codex native subagents are available via .codex/agents and may be used for independent parallel subtasks within a single session or team pane. Skills are loaded from installed SKILL.md files under .codex/skills, not from native agent TOMLs. Use workflow skills via $name when explicitly invoked or clearly routed by AGENTS.md. Treat installed prompts as narrower internal execution surfaces under AGENTS.md authority, even when user-facing docs prefer $name keywords."

# The provider needs no Authorization header, so there is no `env_key` here. It
# answers the OpenAI Responses API at /v1/responses, which is the only wire_api
# Codex 0.118.0 accepts.
[model_providers.ollama-gw]
name = "Ollama gateway"
base_url = "http://10.31.1.9:30068/v1"
wire_api = "responses"

[sandbox_workspace_write]
# No outbound network from sandboxed commands. The agent can still use its own
# web tools.
network_access = false
# Keep /tmp writable.
exclude_slash_tmp = false

[history]
persistence = "save-all"

# ============================================================
# oh-my-codex (OMX) Configuration
# Managed by omx setup — manual edits preserved on next setup.
#
# Carried over from the OMX-generated config rather than dropped, so the omx_*
# MCP servers and project trust survive. Delete this block for a minimal file.
# This Codex version knows max_threads/max_depth, not
# max_concurrent_threads_per_session.
# ============================================================

[features]
multi_agent = true
child_agents_md = true

[env]
USE_OMX_EXPLORE_CMD = "1"

[agents]
max_threads = 6
max_depth = 2

# OMX State Management MCP Server
[mcp_servers.omx_state]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/state-server.js"]
enabled = true
startup_timeout_sec = 5

# OMX Project Memory MCP Server
[mcp_servers.omx_memory]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/memory-server.js"]
enabled = true
startup_timeout_sec = 5

# OMX Code Intelligence MCP Server (LSP diagnostics, AST search)
[mcp_servers.omx_code_intel]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/code-intel-server.js"]
enabled = true
startup_timeout_sec = 10

# OMX Trace MCP Server (agent flow timeline & statistics)
[mcp_servers.omx_trace]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/trace-server.js"]
enabled = true
startup_timeout_sec = 5

# OMX Team MCP Server (team job lifecycle: start, status, wait, cleanup)
[mcp_servers.omx_team_run]
command = "node"
args = ["/usr/lib/node_modules/oh-my-codex/dist/mcp/team-server.js"]
enabled = true
startup_timeout_sec = 5

[projects."/home/shaowu"]
trust_level = "trusted"

[projects."/mnt/projects/brain"]
trust_level = "trusted"

[projects."/mnt/projects/tools/claude-worker"]
trust_level = "trusted"
